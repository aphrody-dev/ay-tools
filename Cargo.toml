[workspace]
resolver = "3"
members = ["crates/*"]
# The forks and references keep their own build systems.
exclude = ["build", ".cache"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tree-sitter = "0.27.2"
tree-sitter-python = "0.25.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

# The shipped binary: whole-program optimization, one codegen unit, no unwinding, no symbols.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
