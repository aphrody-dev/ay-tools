# Sources of ay-tools. GitHub upstreams are aphrody-labs forks and submodules (forks.toml); the Chromium tools are not on GitHub and are
# pinned references: tools/reference.ts fetches a pinned tree as an archive into the git-ignored .cache/ for parity tests and for reading
# their behavior, and never copies it into this repository. Pins move with `bun tools/reference.ts update`.

[meta]
id = "ay-tools"
binary = "ay"

[[reference]]
name = "depot_tools"
url = "https://chromium.googlesource.com/chromium/tools/depot_tools"
commit = "ec77017fb3e090ff02bffb9c6980ebcdd3006ddc"
license = "BSD-3-Clause"
takes = "gclient, fetch, git cl, roll-dep, autoninja, cipd and vpython wrappers, presubmit"

[[reference]]
name = "chromium-build"
url = "https://chromium.googlesource.com/build"
commit = "46073ab3782c86284dc19c7e3e794a599eff41a5"
license = "BSD-3-Clause"
takes = "tools of the Chrome Build Team (siso, kajiya, gong, runmc, bench)"

[[reference]]
name = "infra-build-2025-06"
url = "https://chromium.googlesource.com/infra/infra/go/src/infra"
commit = "1e819790aacff130baa421f647da27b9fed99ccb"
path = "build"
license = "BSD-3-Clause"
takes = "the same Build Team tools before they moved to the build repository: the linked historical snapshot"

[[reference]]
name = "infra"
url = "https://chromium.googlesource.com/infra/infra"
commit = "f50a8b2930b23ab72da84c5356644e5996eed5fb"
license = "BSD-3-Clause"
takes = "recipes, luci and cipd conventions the build tools talk to"

# Chromium's build tools and infra, at the revisions a real Chromium release pins. The pins are not typed here: tools/chromium.ts resolves
# the DEPS file of `version` with ay-deps (this repository's gclient in Rust) and reads each source's revision from the dependency named
# by `dep`, so a new Chromium version moves every pin at once. Sources and outputs live under the data directory (tools/home.ts).
[chromium]
version = "160.0.8166.0"
# The target the binaries are built for, and the build host's Rust target: cross builds run on the build host.
windows = "x86_64-pc-windows-msvc"

[[chromium.source]]
name = "build"
repo = "https://chromium.googlesource.com/build"
dep = "src/third_party/siso/cipd"
package = "build/siso/"

[[chromium.source]]
name = "infra-luci"
repo = "https://chromium.googlesource.com/infra/infra"
dep = "src/tools/luci-go"
package = "infra/tools/luci/cas/"
submodules = ["go/src/go.chromium.org/luci"]

[[chromium.source]]
name = "infra-resultdb"
repo = "https://chromium.googlesource.com/infra/infra"
dep = "src/tools/resultdb"
package = "infra/tools/result_adapter/"
# The Go module of infra replaces these three modules by sibling submodules (go.mod `replace ... => ../go.chromium.org/...`).
submodules = ["go/src/go.chromium.org/luci", "go/src/go.chromium.org/chromiumos/config", "go/src/go.chromium.org/chromiumos/infra/proto"]

[[chromium.source]]
name = "gn"
repo = "https://gn.googlesource.com/gn"
dep = "src/buildtools/linux64"
package = "gn/gn/"

[[chromium.source]]
name = "ninja"
repo = "https://github.com/ninja-build/ninja"
dep = "src/third_party/ninja"
package = "infra/3pp/tools/ninja/"

[[chromium.source]]
name = "depot_tools"
repo = "https://chromium.googlesource.com/chromium/tools/depot_tools"
dep = "src/third_party/depot_tools"

# kind go: `go build` for GOOS=windows (no cgo, trimmed, stripped). kind cmake: clang-cl with the Windows SDK of cargo-xwin and thin-LTO
# through lld-link. kind copy: the tree as it is (Python tools). `dir` is relative to the source, `main` the package or target.
[[chromium.tool]]
name = "siso"
source = "build"
kind = "go"
dir = "siso"
main = "."

[[chromium.tool]]
name = "cas"
source = "infra-luci"
kind = "go"
dir = "go/src/go.chromium.org/luci"
main = "./client/cmd/cas"

[[chromium.tool]]
name = "isolate"
source = "infra-luci"
kind = "go"
dir = "go/src/go.chromium.org/luci"
main = "./client/cmd/isolate"

[[chromium.tool]]
name = "swarming"
source = "infra-luci"
kind = "go"
dir = "go/src/go.chromium.org/luci"
main = "./client/cmd/swarming"

[[chromium.tool]]
name = "result_adapter"
source = "infra-resultdb"
kind = "go"
dir = "go/src/infra"
main = "./tools/result_adapter"

[[chromium.tool]]
name = "ninja"
source = "ninja"
kind = "cmake"
dir = "."
main = "ninja"

[[chromium.tool]]
name = "depot_tools"
source = "depot_tools"
kind = "copy"
dir = "."
main = "."

# This repository's own binaries for Windows: `main` is the Cargo package; its .exe files go to the same output folder.
[[chromium.tool]]
name = "ay-deps"
source = "ay-tools"
kind = "rust"
dir = "."
main = "ay-tools-deps"
