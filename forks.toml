# Upstreams of ay-tools that live on GitHub, as aphrody-labs forks. They are not part of this repository: tools/fetch.ts checks them out
# as plain folders under the data directory (tools/home.ts). Created with rust-mono's tools/add.ts and fork.ts (--manifest forks.toml).
# The Chromium tools are not on GitHub: ay-tools.toml pins them and tools/chromium.ts fetches them.

[meta]
org = "aphrody-labs"
consumer = "aphrody-dev"

[groups]
build = "build systems and task runners merged into ay-tools"

[[fork]]
path = "build/just"
name = "just"
upstream = "casey/just"
branch = "master"
role = "consumer"

[[fork]]
path = "build/turborepo"
name = "turborepo"
upstream = "vercel/turborepo"
branch = "main"
role = "consumer"

[[fork]]
path = "build/bazel"
name = "bazel"
upstream = "bazelbuild/bazel"
branch = "master"
role = "consumer"

[[fork]]
path = "build/rules_rust"
name = "rules_rust"
upstream = "bazelbuild/rules_rust"
branch = "main"
role = "consumer"

[[fork]]
path = "build/rules_cc"
name = "rules_cc"
upstream = "bazelbuild/rules_cc"
branch = "main"
role = "consumer"
